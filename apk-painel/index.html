<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel — Barbearia do Jota</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ===== painel (aproveita o visual do site) ===== */
    .painel-topo{margin-top:var(--topo-seguro,0px)}
    .painel-wrap{max-width:840px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
    .st-card{text-align:center;padding:20px;cursor:default}
    .st-grande{font-size:26px;font-weight:900;margin:6px 0}
    .st-grande.ok{color:var(--green);text-shadow:0 0 10px rgba(34,197,94,.35)}
    .st-grande.no{color:var(--red);text-shadow:0 0 10px rgba(239,68,68,.35)}
    .st-garra{color:var(--muted);font-size:13px}
    .seg{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
    .seg button{border:1px solid var(--border);background:#141418;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:13px}
    .seg button.on{background:var(--gold);color:#111;border-color:var(--gold)}
    .horas{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
    .horas .campo{display:flex;flex-direction:column;gap:4px;text-align:left}
    .horas label{font-size:12px;color:var(--muted)}
    .horas input{background:#141418;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;color-scheme:dark}
    .st-aviso{margin-top:10px}
    .ag-titulo{font-size:18px;font-weight:800;margin:0}
    .ag{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
    .ag + .ag{margin-top:10px}
    .ag.novo{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
    .ag-ico{font-size:22px;line-height:1}
    .ag b{display:block}
    .ag small{color:var(--muted)}
    .ag-lado{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
    .pago{color:var(--green);font-weight:800}
    .espera{color:#f59e0b;font-weight:700}
    .dinheiro{color:var(--text);font-weight:700}
    .vazio{color:var(--muted);text-align:center;padding:30px 0}
    .wpp-mini{color:var(--green);text-decoration:none;font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <header class="topbar painel-topo">
    <div class="topbar-inner">
      <div class="brand">
        <img id="logoTec" src="logo.svg" alt="logo" width="34" height="34">
        <div>
          <strong>Painel do Barbeiro</strong>
          <span>Barbearia do Jota</span>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button id="btnCfg" class="nav-ico" aria-label="Ajustes" title="Ajustes">⚙️</button>
      </div>
    </div>
  </header>

  <main class="painel-wrap">
    <!-- status aberto/fechado -->
    <div class="card st-card">
      <p class="st-garra">A loja está — toque para mudar os horários</p>
      <div id="stGrande" class="st-grande">—</div>
      <div class="seg">
        <button id="mAuto">⏱️ Horário automático</button>
        <button id="mAberto">🟢 Forçar aberto</button>
        <button id="mFechado">🔴 Forçar fechado</button>
      </div>
      <div class="horas">
        <div class="campo">
          <label>Abre às</label>
          <input id="inpAbre" type="time" value="09:00">
        </div>
        <div class="campo">
          <label>Fecha às</label>
          <input id="inpFecha" type="time" value="21:00">
        </div>
        <button id="btnSalvarHoras" class="btn btn-gold btn-sm">💾 Salvar horários</button>
      </div>
      <p class="tiny st-aviso" id="stAviso">—</p>
    </div>

    <!-- agendamentos -->
    <section>
      <p class="ag-titulo">📋 Agendamentos</p>
      <p class="tiny">Chegam direto do site. A lista atualiza sozinha.</p>
      <div id="listaAg"><div class="vazio">Procurando o servidor...</div></div>
    </section>
  </main>

  <!-- ajustes: endereco do servidor + PIN -->
  <div id="modalCfg" class="modal hidden">
    <div class="modal-card" style="text-align:left">
      <h2 style="text-align:center">⚙️ Ajustes</h2>
      <p class="tiny" style="text-align:center">Versão do aplicativo: <b id="painelVersao">—</b></p>
      <label style="font-size:12px;color:var(--muted)">Endereço do servidor (o PC da barbearia)</label>
      <input id="inpServidorPainel" placeholder="http://192.168.1.73:3001" inputmode="url"
             style="width:100%;background:#141418;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;box-sizing:border-box">
      <label style="font-size:12px;color:var(--muted);display:block;margin-top:10px">PIN do painel</label>
      <input id="inpPin" placeholder="1234" inputmode="numeric"
             style="width:100%;background:#141418;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;box-sizing:border-box">
      <p class="tiny" id="cfgAviso" style="margin-top:8px">—</p>
      <button id="btnSalvarCfg" class="btn btn-gold btn-block">💾 Salvar e testar</button>
      <button id="btnVerificarUpdate" class="btn btn-ghost btn-block">⬇️ Baixar a versão atualizada do APK</button>
      <p class="tiny" id="updStatus">—</p>
      <button id="btnFecharCfg" class="btn btn-ghost btn-block">Fechar</button>
    </div>
  </div>

  <!-- atualizacao -->
  <div id="modalUpdate" class="modal hidden">
    <div class="modal-card">
      <h2>🔁 Nova versão do Painel</h2>
      <p class="tiny" id="updVersao">—</p>
      <p class="tiny" id="updAtual">—</p>
      <div id="updNotas" class="tiny" style="text-align:left;margin:10px 0">—</div>
      <button id="btnAtualizar" class="btn btn-gold btn-block">⬇️ Atualizar agora</button>
      <button id="btnDepois" class="btn btn-ghost btn-block">Depois</button>
    </div>
  </div>

  <script src="painel.js?v=1"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rye&amp;display=swap');
    .western { font-family: 'Rye', Georgia, 'Times New Roman', serif; }
  </style>
  <defs>
    <pattern id="diag" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#111"/>
      <rect width="11" height="22" fill="#fff"/>
    </pattern>
  </defs>

  <rect width="640" height="640" fill="#fff"/>

  <!-- poste esquerdo -->
  <g>
    <rect x="66" y="252" width="68" height="252" rx="6" fill="url(#diag)" stroke="#111" stroke-width="6"/>
    <circle cx="100" cy="238" r="40" fill="#111"/>
    <rect x="60" y="238" width="80" height="16" fill="#111"/>
    <rect x="56" y="504" width="88" height="34" rx="6" fill="#111"/>
  </g>
  <!-- poste direito -->
  <g>
    <rect x="506" y="252" width="68" height="252" rx="6" fill="url(#diag)" stroke="#111" stroke-width="6"/>
    <circle cx="540" cy="238" r="40" fill="#111"/>
    <rect x="500" y="238" width="80" height="16" fill="#111"/>
    <rect x="496" y="504" width="88" height="34" rx="6" fill="#111"/>
  </g>

  <!-- navalhas vermelhas cruzadas -->
  <g fill="#d21f26">
    <rect x="225" y="120" width="190" height="20" rx="10" transform="rotate(24 320 130)"/>
    <rect x="225" y="120" width="190" height="20" rx="10" transform="rotate(-24 320 130)"/>
    <circle cx="320" cy="130" r="12"/>
  </g>

  <!-- textos -->
  <text x="320" y="300" text-anchor="middle" class="western" font-size="60" font-weight="bold" letter-spacing="3" fill="#111">BARBEARIA</text>
  <text x="172" y="430" text-anchor="middle" class="western" font-size="52" font-weight="bold" fill="#d21f26">DO</text>
  <text x="325" y="468" text-anchor="middle" class="western" font-size="140" font-weight="bold" letter-spacing="2" fill="#111">JOTA</text>
</svg>
